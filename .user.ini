; PHP limits for 20i, applied per-directory by PHP-FPM.
;
; Filament caps vehicle-class photographs at 4 MB in VehicleClassForm. These
; limits sit ABOVE that on purpose: PHP must never reject an upload before
; Laravel's validator has had a chance to return a readable message. A phone
; photograph is routinely 3-6 MB, and without this file nginx returns a raw 413
; that looks like the site being broken.
;
; Stays under 20i's nginx client_max_body_size, which is typically 8 MB —
; raising these past that just moves the rejection back to nginx.
;
; Safe to commit: no secrets here.

upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 8

; Filament image uploads with the editor enabled are memory-hungry.
memory_limit = 256M

; A slow image resize should not 504.
max_execution_time = 60
